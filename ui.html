<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>claude-switch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b2a20'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23171210' stroke='%23c23b2a' stroke-width='4'/%3E%3C/svg%3E">
<style>
@font-face{font-family:"Courier Prime";font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/courier-prime-400-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Courier Prime";font-style:normal;font-weight:400;font-display:swap;src:url("assets/fonts/courier-prime-400-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Courier Prime";font-style:normal;font-weight:700;font-display:swap;src:url("assets/fonts/courier-prime-700-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Courier Prime";font-style:normal;font-weight:700;font-display:swap;src:url("assets/fonts/courier-prime-700-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Archivo;font-style:normal;font-weight:100 900;font-display:swap;src:url("assets/fonts/archivo-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Archivo;font-style:normal;font-weight:100 900;font-display:swap;src:url("assets/fonts/archivo-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}

:root{
  color-scheme:dark;
  --board:#33251c; --board-edge:#271c15; --rule:#b88a3b55;
  --on-board:#efe4cc; --on-board-2:#d2bf9a;
  --label:#efe4cc; --label-2:#e4d6b8; --ink:#1e1712; --ink-2:#5a4330;
  --brass:#b88a3b; --brass-hi:#d9ae5f; --cord:#c23b2a; --cord-hi:#e0513e;
  --plate:#171210; --plate-text:#e9dcc2; --plate-2:#b9a582;
  --ok:#7fb069; --shadow:0 2px 3px #0000004d,0 10px 24px -8px #00000080;
  --radius:10px;
  --mono:"Courier Prime",ui-monospace,monospace;
  --sans:Archivo,system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --gutter:max(clamp(16px,3vw,28px),calc((100vw - 1180px) / 2));
}
@media (prefers-color-scheme:light){
  :root{
    color-scheme:light;
    --board:#cdb48b; --board-edge:#b99d70; --rule:#5a433055;
    --on-board:#22180f; --on-board-2:#4a3523;
    --label:#fbf6ea; --label-2:#f1e8d4;
    --shadow:0 1px 2px #3b2a2033,0 10px 22px -10px #3b2a2066;
  }
}
*{box-sizing:border-box}
html{background:var(--board);color:var(--on-board);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body{margin:0;min-height:100vh;display:flex;flex-direction:column}
::selection{background:var(--brass);color:var(--ink)}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
.jack:not(.add) :focus-visible{outline-color:var(--ink)}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:var(--brass);border:3px solid var(--board);border-radius:8px}
::-webkit-scrollbar-track{background:var(--board)}
button,input,select{font:inherit;color:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 16px;border-radius:7px;border:1px solid var(--brass);background:transparent;color:var(--on-board);font-weight:600;font-size:14px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:#b88a3b22;border-color:var(--brass-hi)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.btn.primary:hover{background:var(--brass-hi);border-color:var(--brass-hi)}
.btn:disabled{opacity:.55;cursor:default;background:transparent}
.btn.primary:disabled{background:var(--brass)}
.btn.icon{padding:0;width:38px;justify-content:center}
.btn.busy{pointer-events:none}
.btn.busy::after{content:"";width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}

/* header */
header{display:flex;align-items:center;gap:14px;padding:14px var(--gutter);border-bottom:1px solid var(--rule)}
.mark{font:800 19px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase}
.unofficial{font:400 13px var(--mono);color:var(--on-board-2)}
header .sp{flex:1}

/* the terminal line */
.line{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;margin:22px var(--gutter) 0;padding:14px 18px 14px 58px;background:var(--plate);color:var(--plate-text);border-radius:var(--radius);box-shadow:var(--shadow)}
.plug{position:absolute;left:21px;bottom:16px;width:16px;height:16px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 4px #b88a3b40}
.line::before{content:"";position:absolute;left:28px;top:18px;bottom:30px;border-left:2px dotted #b88a3b66}
.line-text{font:400 14px var(--mono)}
.line-text b{font-weight:700}
.line .sp{flex:1}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;color:var(--plate-text)}
.switch input{appearance:none;margin:0;width:40px;height:22px;border-radius:11px;background:#4a3a2c;position:relative;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--plate-text);transition:transform .25s var(--ease)}
.switch input:checked{background:var(--brass)}
.switch input:checked::after{background:var(--ink)}
.switch input:checked::after{transform:translateX(18px)}
.hint{width:100%;margin:0;font-size:13px;color:var(--plate-2)}
#status{width:100%;margin:0;font:400 13px var(--mono);color:var(--brass-hi);min-height:0}
#status:empty{display:none}
#status.err{color:#ff8a78}

/* board */
main{flex:1;position:relative;padding:44px var(--gutter) 28px}
#cord{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
#cord-tip{fill:var(--cord);stroke:var(--plate);stroke-width:2.5}
#cord path{fill:none;stroke:var(--cord);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 3px 2px #00000059)}
.jacks{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:18px;list-style:none;margin:0;padding:0}
.jack{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--label);color:var(--ink);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.jack.live{box-shadow:0 0 0 2px var(--cord),var(--shadow)}
.jack-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.hole{width:38px;height:38px;border-radius:50%;background:var(--plate);border:5px solid var(--brass);box-shadow:inset 0 0 0 3px #3b2a20;flex:none}
.live .hole{border-color:var(--cord)}
.resting .hole{border-color:#9c8a6d}
.key{font:700 12px var(--mono);color:var(--ink-2);border:1px solid #5a433044;border-radius:4px;padding:1px 6px}
.name{margin:0;padding-top:10px;border-top:1px dashed #3b2a2059;font:700 18px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.meta{margin:0;font:400 14px/1.5 var(--mono);color:var(--ink-2);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.state{display:flex;align-items:center;gap:8px;font:650 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.state::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.live .state{color:var(--cord)}
.free .state{color:#3f6b2f}
.resting .state{color:#8a5a12}
.usage{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px 10px;margin:2px 0 0;padding:10px 0 2px;border-top:1px dashed #3b2a2059}
.usage dt{font:650 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.usage dd{margin:0}
.bar{height:6px;border-radius:3px;background:#3b2a2024;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ink-2);transition:width .6s var(--ease)}
.bar.high i{background:#b07a1f}
.bar.full i{background:#8a5a12}
.pct{font:400 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);text-align:right;white-space:nowrap}
.pct small{font-size:12px;color:var(--ink-2)}
.usage-note{grid-column:1/-1;margin:0;font:400 12px/1.4 var(--sans);color:var(--ink-2)}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.jack .btn{color:var(--ink);border-color:#5a433066}
.jack .btn:hover{background:#3b2a2012;border-color:var(--ink-2)}
.jack .btn.primary{background:var(--ink);border-color:var(--ink);color:var(--label)}
.jack .btn.primary:hover{background:#3b2a20}
.jack .btn.primary:disabled{background:transparent;color:var(--ink-2);border-color:#5a433044}
.browser-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.browser-row select,.field input,.footer select{min-height:34px;border-radius:6px;border:1px solid #5a433066;background:var(--label-2);color:var(--ink);padding:0 8px;max-width:100%}
.browser-row select{flex:1;min-width:0}

/* menu */
.menu{position:relative}
.menu-list{position:absolute;right:0;top:calc(100% + 6px);z-index:5;min-width:220px;margin:0;padding:6px;list-style:none;background:var(--plate);color:var(--plate-text);border-radius:8px;box-shadow:0 4px 6px #0000004d,0 18px 40px -12px #000000a0;transform-origin:top right;animation:pop .18s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.menu-list button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:5px;background:none;text-align:left;font-size:14px;cursor:pointer}
.menu-list button:hover,.menu-list button:focus-visible{background:#ffffff14;outline:none}
.menu-list button.danger{color:#ff8a78}
.menu-list hr{border:0;border-top:1px solid #ffffff1f;margin:5px 4px}

/* the empty jack: add account */
.add{background:transparent;color:var(--on-board);border:2px dashed var(--rule);box-shadow:none}
.add .hole{background:transparent;border-style:dashed;border-color:var(--rule);box-shadow:none}
.add h2{margin:0;font:700 18px var(--mono);text-transform:uppercase}
.add p{margin:0;font-size:14px;color:var(--on-board-2)}
.field{display:grid;gap:4px;font-size:13px;color:var(--on-board-2)}
.field input{background:var(--label);border-color:transparent}
.add .btn{color:var(--on-board);border-color:var(--brass)}
.add .btn:hover{background:#b88a3b22}
.add .btn.primary{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.add .btn.primary:hover{background:var(--brass-hi)}
.jack .btn.primary:disabled{opacity:1}

/* footer: continue */
.footer{position:sticky;bottom:0;z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px var(--gutter);background:var(--board);border-top:1px solid var(--rule);box-shadow:0 -10px 24px -14px #00000066;font-size:14px}
.footer label{color:var(--on-board-2)}
.footer select{background:var(--label);flex:1 1 260px;font-family:var(--mono)}
kbd{font:700 12px var(--mono);border:1px solid var(--rule);border-radius:4px;padding:0 5px}
.footnote{color:var(--on-board-2);font-size:13px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){
  header .unofficial{display:none}
  .hint{display:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
  <symbol id="i-term" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="m7 9 3 3-3 3M12 15h5"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></symbol>
</svg>

<header>
  <span class="mark">claude-switch</span>
  <span class="unofficial">unofficial · nothing leaves this computer</span>
  <span class="sp"></span>
  <button class="btn primary" data-act="add-open">Add account</button>
</header>

<section class="line" aria-label="Claude Code">
  <span class="plug" id="plug" aria-hidden="true"></span>
  <span class="line-text" id="line-text">Claude Code</span>
  <span class="sp"></span>
  <label class="switch"><input type="checkbox" id="auto" role="switch"> Switch automatically</label>
  <p class="hint" id="hint">Open Claude sessions pick up a switch on their next message.</p>
  <p id="status" role="status" aria-live="polite"></p>
</section>

<main>
  <svg id="cord" aria-hidden="true"><path id="cord-path" d=""/><circle id="cord-tip" r="0"/></svg>
  <ul class="jacks" id="jacks"></ul>
</main>

<section class="footer" aria-label="Continue in a project">
  <label for="project">Reopen Claude in</label>
  <select id="project"></select>
  <button class="btn" id="continue"><svg class="i"><use href="#i-term"/></svg>Open with <code>--continue</code></button>
  <span class="footnote">Keys <kbd>1</kbd>–<kbd>9</kbd> patch in an account.</span>
</section>

<script>
const TOKEN = '__TOKEN__';
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const icon = (n) => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let S = null, openMenu = null, adding = false, renaming = null, confirmRemove = null, lastActive = null;

async function api(path, body) {
  const r = await fetch(path, { method: body === undefined ? 'GET' : 'POST', headers: { 'x-token': TOKEN, 'content-type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: 'The app stopped responding. Reopen claude-switch.' }));
  if (!r.ok) throw new Error(j.error || 'Something went wrong.');
  return j;
}
function status(msg, err) { const s = $('#status'); s.textContent = msg || ''; s.classList.toggle('err', !!err); }
const time = (ms) => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
// Today: "02:40". Later this week: "Sat 23:00".
const when = (ms) => (new Date(ms).toDateString() === new Date().toDateString() ? time(ms) : new Date(ms).toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' }));
let USAGE = null, SWITCH_AT = 90;
// Mirrors the app's choice: the fuller of the two windows decides; the emptiest free account goes next.
const fullness = (u) => { const ws = [u && u.session, u && u.week].filter((w) => w && typeof w.pct === 'number'); return ws.length ? Math.max(...ws.map((w) => w.pct)) : 50; };
function nextUp() {
  if (!S || !USAGE) return null;
  const c = S.accounts.filter((a) => !a.active && !a.limitedUntil && USAGE[a.name] && !USAGE[a.name].error)
    .map((a) => ({ n: a.name, f: fullness(USAGE[a.name]) })).filter((x) => x.f < 100).sort((a, b) => a.f - b.f);
  return c.length ? c[0].n : null;
}
async function refreshUsage() {
  try { const r = await api('/api/usage'); USAGE = r.usage; SWITCH_AT = r.switchAt; render(); } catch { /* keep the last numbers */ }
}
function usageHtml(name) {
  const u = USAGE && USAGE[name];
  if (!u) return `<dl class="usage"><p class="usage-note">Checking limits…</p></dl>`;
  if (u.error) return `<dl class="usage"><p class="usage-note">${esc(u.error)}</p></dl>`;
  const row = (label, w) => {
    if (!w) return '';
    const cls = w.pct >= 100 ? 'full' : w.pct >= 80 ? 'high' : '';
    const reset = w.resetsAt ? ` <small>· ${esc(when(w.resetsAt))}</small>` : '';
    return `<dt>${label}</dt><dd><div class="bar ${cls}" role="meter" aria-label="${label} limit used" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${w.pct}"><i style="width:${Math.min(100, w.pct)}%"></i></div></dd>
      <dd class="pct">${w.pct}%${reset}</dd>`;
  };
  return `<dl class="usage" title="Share of this plan's limit used, and when it resets">${row('Session', u.session)}${row('Week', u.week)}</dl>`;
}

async function refresh() {
  try { S = await api('/api/state'); render(); }
  catch (e) { status(e.message, true); }
}

function stateOf(a) {
  if (a.active) return { cls: 'live', label: 'Connected' };
  if (a.limitedUntil) return { cls: 'resting', label: `Resting · back ${a.limitExact ? 'at' : 'by'} ${when(a.limitedUntil)}` };
  return { cls: 'free', label: a.name === nextUp() && S.accounts.length > 2 ? 'Free · next up' : 'Free' };
}

function browserSelect(a, i) {
  const opts = ['<option value="">No browser profile</option>'];
  for (const b of S.browsers) {
    opts.push(`<optgroup label="${esc(b.name)}">`);
    for (const p of b.profiles) {
      const v = `${b.id}|${p.dir}`;
      const sel = a.browser && a.browser.id === b.id && a.browser.dir === p.dir ? ' selected' : '';
      opts.push(`<option value="${esc(v)}"${sel}>${esc(b.name)} · ${esc(p.name)}${p.user ? ' (' + esc(p.user) + ')' : ''}</option>`);
    }
    opts.push(`<option value="${esc(b.id)}|__new">${esc(b.name)} · New profile…</option></optgroup>`);
  }
  return `<label class="browser-row">${icon('globe')}
    <select data-browser="${esc(a.name)}" aria-label="Browser profile for ${esc(a.name)}">${opts.join('')}</select></label>`;
}

function jackHtml(a, i) {
  const st = stateOf(a);
  const menu = openMenu === a.name ? `<ul class="menu-list" role="menu">
      <li><button role="menuitem" data-act="continue" data-name="${esc(a.name)}">${icon('term')}Patch in &amp; reopen Claude</button></li>
      ${a.browser ? `<li><button role="menuitem" data-act="open-browser" data-name="${esc(a.name)}">${icon('globe')}Open its browser profile</button></li>` : ''}
      ${a.limitedUntil ? `<li><button role="menuitem" data-act="clear-limit" data-name="${esc(a.name)}">${icon('reset')}Mark as not limited</button></li>` : ''}
      <li><button role="menuitem" data-act="rename" data-name="${esc(a.name)}">${icon('edit')}Rename</button></li>
      <li><button role="menuitem" data-act="move" data-delta="-1" data-name="${esc(a.name)}" ${i === 0 ? 'disabled' : ''}>${icon('left')}Move left</button></li>
      <li><button role="menuitem" data-act="move" data-delta="1" data-name="${esc(a.name)}" ${i === S.accounts.length - 1 ? 'disabled' : ''}>${icon('right')}Move right</button></li>
      <li><hr></li>
      <li><button role="menuitem" class="danger" data-act="remove" data-name="${esc(a.name)}">${icon('trash')}Remove from this computer</button></li>
    </ul>` : '';
  const nameEl = renaming === a.name
    ? `<form class="field" data-rename="${esc(a.name)}"><input name="to" value="${esc(a.name)}" aria-label="New name" pattern="[A-Za-z0-9][A-Za-z0-9_.-]{0,31}" required autofocus></form>`
    : `<h3 class="name">${esc(a.name)}</h3>`;
  const removeRow = confirmRemove === a.name
    ? `<div class="actions"><button class="btn primary" data-act="remove-yes" data-name="${esc(a.name)}">Remove</button><button class="btn" data-act="remove-no">Keep</button></div>
       <p class="meta">Forgets this login here. You can sign in again any time.</p>`
    : `<div class="actions">
        <button class="btn primary" data-act="switch" data-name="${esc(a.name)}" ${a.active ? 'disabled' : ''}>${a.active ? 'Patched in' : 'Patch in'}</button>
        <div class="menu"><button class="btn icon" data-act="menu" data-name="${esc(a.name)}" aria-haspopup="menu" aria-expanded="${openMenu === a.name}" aria-label="More for ${esc(a.name)}">${icon('more')}</button>${menu}</div>
      </div>`;
  return `<li class="jack ${st.cls}" data-jack="${esc(a.name)}">
    <div class="jack-top"><span class="hole" aria-hidden="true"></span>${i < 9 ? `<span class="key" title="Press ${i + 1}">${i + 1}</span>` : ''}</div>
    ${nameEl}
    <p class="meta">${esc(a.email)}${a.plan ? '<br>' + esc(a.plan) : ''}</p>
    <span class="state">${esc(st.label)}</span>
    ${usageHtml(a.name)}
    ${browserSelect(a, i)}
    ${removeRow}
  </li>`;
}

function addHtml() {
  const first = !S.accounts.length;
  if (!adding && !first) {
    return `<li class="jack add"><div class="jack-top"><span class="hole" aria-hidden="true"></span></div>
      <h2>Empty jack</h2><p>Sign in to another Claude account once on this computer.</p>
      <div class="actions"><button class="btn" data-act="add-open">${icon('plus')}Add account</button></div></li>`;
  }
  return `<li class="jack add"><form id="add-form" style="display:contents">
    <div class="jack-top"><span class="hole" aria-hidden="true"></span></div>
    <h2>${first ? 'Add your first account' : 'Add account'}</h2>
    <p>${first ? 'Sign in to each of your Claude accounts once on this computer. A browser page opens for the sign-in.' : 'A browser page opens for the sign-in.'}</p>
    <label class="field">Name<input name="name" required pattern="[A-Za-z0-9][A-Za-z0-9_.-]{0,31}" placeholder="work" autocomplete="off" autofocus></label>
    <label class="field">Email (optional, fills in the sign-in page)<input name="email" type="email" placeholder="you@example.com" autocomplete="off"></label>
    <div class="actions"><button class="btn primary" type="submit">Sign in</button>${first ? '' : '<button class="btn" type="button" data-act="add-close">Cancel</button>'}</div>
  </form></li>`;
}

function render() {
  const n = S.claudeRunning;
  $('#line-text').innerHTML = n ? `Claude Code · <b>${n} session${n > 1 ? 's' : ''}</b> running` : 'Claude Code · not running';
  $('#auto').checked = S.autoSwitch;
  $('#hint').innerHTML = S.autoSwitch
    ? `When the patched-in account passes <b>${SWITCH_AT}%</b> of a limit, your next prompt goes to the account with the most room. If a reply still hits a limit, it switches and you type <b>continue</b>.`
    : 'Open Claude sessions pick up a switch on their next message. Turn on automatic switching to move to the account with the most room before a limit stops you.';
  const focused = document.activeElement && document.activeElement.closest('[data-jack], .add');
  if (focused && (adding || renaming)) return; // don't wipe a form being typed in
  if ($('#add-form .busy')) return; // sign-in in progress
  const typed = $('#add-form') ? Object.fromEntries(new FormData($('#add-form'))) : null;
  $('#jacks').innerHTML = S.accounts.map(jackHtml).join('') + addHtml();
  if (typed && $('#add-form')) for (const [k, v] of Object.entries(typed)) $(`#add-form [name=${k}]`).value = v;
  const sel = $('#project'), cur = sel.value || S.lastProject;
  sel.innerHTML = S.projects.length ? S.projects.map((p) => { const cut = Math.max(p.lastIndexOf('/'), p.lastIndexOf(String.fromCharCode(92))); const leaf = p.slice(cut + 1) || p; return `<option value="${esc(p)}"${p === cur ? ' selected' : ''}>${esc(leaf)} — ${esc(p.slice(0, cut))}</option>`; }).join('') : '<option value="">No recent projects</option>';
  $('#continue').disabled = !S.projects.length;
  const act = S.accounts.find((a) => a.active);
  drawCord(act && act.name !== lastActive && lastActive !== null);
  lastActive = act ? act.name : '';
}

// The signature: a patch cord from the terminal line into the live jack.
function drawCord(animate) {
  const svg = $('#cord'), path = $('#cord-path');
  const live = $('.jack.live .hole');
  const tip = $('#cord-tip');
  if (!live) { path.setAttribute('d', ''); tip.setAttribute('r', 0); return; }
  const box = svg.getBoundingClientRect(), p = $('#plug').getBoundingClientRect(), h = live.getBoundingClientRect();
  const x1 = p.left + p.width / 2 - box.left, y1 = p.top + p.height / 2 - box.top;
  const x2 = h.left + h.width / 2 - box.left, y2 = h.top + h.height / 2 - box.top;
  const sag = Math.min(120, 40 + Math.abs(x2 - x1) * 0.18);
  path.setAttribute('d', `M${x1},${y1} C${x1},${y1 + sag + 30} ${x2},${y2 - sag} ${x2},${y2}`);
  tip.setAttribute('cx', x2); tip.setAttribute('cy', y2); tip.setAttribute('r', 7);
  if (animate && !reduced) {
    const len = path.getTotalLength();
    path.animate([{ strokeDasharray: len, strokeDashoffset: len }, { strokeDasharray: len, strokeDashoffset: 0 }], { duration: 700, easing: 'cubic-bezier(.16,1,.3,1)' });
  }
}

async function doSwitch(name, btn) {
  btn && btn.classList.add('busy');
  try {
    const r = await api('/api/switch', { name, openBrowser: true });
    const a = S.accounts.find((x) => x.name === name);
    status(r.changed ? `Patched in ${name} (${a.email}).${a.browser ? ' Opening its browser profile.' : ''}` : `${name} is already patched in.`);
  } catch (e) { status(e.message, true); }
  openMenu = null; await refresh();
}

document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) { if (openMenu && !e.target.closest('.menu')) { openMenu = null; render(); } return; }
  const name = b.dataset.name;
  try {
    switch (b.dataset.act) {
      case 'switch': return doSwitch(name, b);
      case 'menu': openMenu = openMenu === name ? null : name; render(); if (openMenu) $(`[data-jack="${CSS.escape(name)}"] .menu-list button`)?.focus(); return;
      case 'continue': {
        const dir = $('#project').value;
        if (!dir) return status('No recent project folder to reopen Claude in.', true);
        await api('/api/continue', { name, dir }); status(`Patched in ${name} and reopened Claude in ${dir}.`); break;
      }
      case 'open-browser': await api('/api/open-browser', { name }); status(`Opened the browser profile for ${name}.`); break;
      case 'clear-limit': await api('/api/clear-limit', { name }); break;
      case 'rename': renaming = name; openMenu = null; render(); $('[data-rename] input')?.select(); return;
      case 'move': await api('/api/move', { name, delta: Number(b.dataset.delta) }); break;
      case 'remove': confirmRemove = name; openMenu = null; render(); return;
      case 'remove-no': confirmRemove = null; render(); return;
      case 'remove-yes': await api('/api/remove', { name }); confirmRemove = null; status(`Removed ${name} from this computer.`); break;
      case 'add-open': adding = true; render(); $('#add-form')?.closest('.jack').scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'center' }); $('#add-form input')?.focus(); return;
      case 'add-close': adding = false; render(); return;
    }
  } catch (err) { status(err.message, true); }
  openMenu = null; refresh();
});

document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'add-form') {
    const btn = $('button[type=submit]', f), d = Object.fromEntries(new FormData(f));
    btn.classList.add('busy'); btn.textContent = 'Waiting for sign-in';
    status('Finish the sign-in in the browser page that just opened.');
    try { const r = await api('/api/add', { name: d.name.trim(), email: d.email.trim() || undefined }); adding = false; status(`Saved ${r.email} as ${d.name.trim()}. It is now patched in.`); }
    catch (err) { status(err.message, true); btn.classList.remove('busy'); btn.textContent = 'Sign in'; return; }
    refresh();
  } else if (f.dataset.rename) {
    const from = f.dataset.rename, to = new FormData(f).get('to').trim();
    renaming = null;
    if (to && to !== from) { try { await api('/api/rename', { name: from, to }); } catch (err) { status(err.message, true); } }
    refresh();
  }
});
document.addEventListener('focusout', (e) => { if (e.target.closest('[data-rename]')) setTimeout(() => { if (renaming && !document.activeElement.closest('[data-rename]')) { renaming = null; render(); } }, 0); });

document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.id === 'auto') {
    try { await api('/api/auto', { on: t.checked }); status(t.checked ? 'Automatic switching is on.' : 'Automatic switching is off.'); }
    catch (err) { status(err.message, true); }
    return refresh();
  }
  if (t.dataset.browser) {
    const [id, dir] = t.value ? t.value.split('|') : [null, null];
    try {
      const r = await api('/api/browser', { name: t.dataset.browser, id, dir: dir === '__new' ? undefined : dir, create: dir === '__new' });
      if (dir === '__new') status(`Opened a new ${id} profile (${r.dir}). Install Claude in Chrome there and sign in as ${t.dataset.browser}.`);
    } catch (err) { status(err.message, true); }
    refresh();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const busy = $('#add-form .busy');
    if (openMenu || renaming || confirmRemove || (adding && !busy)) { openMenu = renaming = confirmRemove = null; if (!busy) adding = false; document.activeElement?.blur(); render(); }
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey || e.target.closest('input,select,textarea')) return;
  const n = Number(e.key);
  if (n >= 1 && n <= 9 && S && S.accounts[n - 1]) doSwitch(S.accounts[n - 1].name, $(`[data-jack="${CSS.escape(S.accounts[n - 1].name)}"] [data-act=switch]`));
});
$('#continue').addEventListener('click', async () => {
  const dir = $('#project').value;
  try { await api('/api/continue', { dir }); status(`Reopened Claude in ${dir}.`); } catch (e) { status(e.message, true); }
});
addEventListener('resize', () => drawCord(false));
new ResizeObserver(() => drawCord(false)).observe(document.body);
refresh();
refreshUsage();
setInterval(() => { if (!document.hidden) refresh(); else api('/api/ping', {}).catch(() => {}); }, 4000);
setInterval(() => { if (!document.hidden) refreshUsage(); }, 60000);
</script>
</body>
</html>
